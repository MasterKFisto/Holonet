name: holonet

# Holonet local development database (PostgreSQL 16).
#
# LOCAL ONLY. The password comes from the POSTGRES_PASSWORD environment
# variable and falls back to a development-only default. Production
# credentials must come from the environment — never from committed files
# (docs/PROJECT_RULES.md rules 10/11). See docker-compose.prod.yml.

services:
  db:
    image: postgres:16-alpine
    container_name: holonet-db
    restart: unless-stopped
    environment:
      # The image creates the role and database from these variables.
      # POSTGRES_PASSWORD defaults to 'holonet' for LOCAL development only;
      # set it in the environment to override.
      POSTGRES_USER: holonet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holonet}
      POSTGRES_DB: holonet
    ports:
      # Local development only — bound to loopback so the database is never
      # reachable from other hosts. Override the host port with DB_PORT if
      # 5432 is taken locally (e.g. DB_PORT=55432 docker compose up -d).
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - holonet_db_data:/var/lib/postgresql/data
      # Executed once on first initialization (baseline extensions).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U holonet -d holonet']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional web UI for local database inspection. Disabled by default;
  # enable with the 'adminer' profile:
  #   docker compose -f infra/docker/docker-compose.yml --profile adminer up -d
  # Then open http://localhost:8080.
  adminer:
    image: adminer:4.8.1
    profiles: ['adminer']
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  holonet_db_data:
